name: offline tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      # requirements.txt pins the 2018 stack and does not install; the offline
      # engine tests need nothing beyond these three.
      - run: pip install 'numpy>=1.24,<3' 'django>=4.2,<4.3' 'pytest>=8,<10'
      - run: pytest -v -rs
