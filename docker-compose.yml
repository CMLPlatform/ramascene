# Production stack. Copy .env.example to .env and fill it in first.
# Only the web container publishes a port; put TLS (reverse proxy or the host's nginx) in front of it.
services:
  web:
    build: {context: ., target: frontend}
    ports: ["8080:80"]
    depends_on: [api]
    restart: unless-stopped

  api:
    build: {context: ., target: backend}
    env_file: .env
    environment:
      RUN_MIGRATIONS: "1"
      DATABASES_DEFAULT_NAME: /srv/data/db.sqlite3
      DATASETS_DIR: /datasets
    volumes:
      - data:/srv/data
      - ${DATASETS_DIR}:/datasets:ro
    depends_on: [broker]
    restart: unless-stopped

  worker-calc:
    build: {context: ., target: backend}
    env_file: .env
    environment:
      DATABASES_DEFAULT_NAME: /srv/data/db.sqlite3
      DATASETS_DIR: /datasets
    command: celery -A ramasceneMasterProject worker -l info --concurrency 1 --max-tasks-per-child 1 --queues calc_default -n calc@%h
    volumes:
      - data:/srv/data
      - ${DATASETS_DIR}:/datasets:ro
    depends_on: [broker, api]
    restart: unless-stopped

  worker-modelling:
    build: {context: ., target: backend}
    env_file: .env
    environment:
      DATABASES_DEFAULT_NAME: /srv/data/db.sqlite3
      DATASETS_DIR: /datasets
    command: celery -A ramasceneMasterProject worker -l info --concurrency 1 --max-tasks-per-child 1 --queues modelling -n modelling@%h
    volumes:
      - data:/srv/data
      - ${DATASETS_DIR}:/datasets:ro
    depends_on: [broker, api]
    restart: unless-stopped

  broker:
    image: rabbitmq:4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST}
    volumes: [broker:/var/lib/rabbitmq]
    restart: unless-stopped

volumes:
  data:
  broker:
