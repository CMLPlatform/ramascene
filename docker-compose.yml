services:
  reverse_proxy:
    build:
      context: ./
      target: nginx
      args:
        DJANGO_SETTINGS_MODULE: ${DJANGO_SETTINGS_MODULE:-ramasceneMasterProject.config.production}
        PUBLIC_DIR: static_assets
        HOST: ${HOST:-www.ramascene.eu}
        WS_HOST: ${WS_HOST:-www.ramascene.eu}
        PROTOCOL: ${PROTOCOL:-http}
        WS_PROTOCOL: ${WS_PROTOCOL:-ws}
        BROKER_URL: amqp://${RABBITMQ_USERNAME:-guest}:${RABBITMQ_PASSWORD:-guest}@message_broker:5672/${RABBITMQ_VHOST:-/}
        REDIS_HOST: cache
        SECRET_KEY: ${SECRET_KEY}
        DATABASE_NAME: ${DATABASE_NAME:-ramascene.db}
        DATASETS_VERSION: ${DATASETS_VERSION}
    container_name: rama-scene-nginx
    depends_on:
      - webapp
    environment:
      NGINX_BACKEND_HOST: webapp
      NGINX_BACKEND_PORT: 8000
    ports:
      - "80:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
  webapp:
    build:
      context: ./
      target: python
      args:
        DJANGO_SETTINGS_MODULE: ${DJANGO_SETTINGS_MODULE:-ramasceneMasterProject.config.production}
        PUBLIC_DIR: static_assets
        HOST: ${HOST:-www.ramascene.eu}
        WS_HOST: ${WS_HOST:-www.ramascene.eu}
        PROTOCOL: ${PROTOCOL:-http}
        WS_PROTOCOL: ${WS_PROTOCOL:-ws}
        BROKER_URL: amqp://${RABBITMQ_USERNAME:-guest}:${RABBITMQ_PASSWORD:-guest}@message_broker:5672/${RABBITMQ_VHOST:-/}
        REDIS_HOST: cache
        SECRET_KEY: ${SECRET_KEY}
        DATABASE_NAME: ${DATABASE_NAME:-ramascene.db}
        DATASETS_VERSION: ${DATASETS_VERSION}
    container_name: rama-scene-daphne
    depends_on:
      - cache
      - message_broker
    environment:
      DEBUG: ${DEBUG:-false}
      DJANGO_SETTINGS_MODULE: ${DJANGO_SETTINGS_MODULE:-ramasceneMasterProject.config.production}
      PUBLIC_DIR: static_assets
      HOST: ${HOST:-www.ramascene.eu}
      WS_HOST: ${WS_HOST:-www.ramascene.eu}
      PROTOCOL: ${PROTOCOL:-http}
      WS_PROTOCOL: ${WS_PROTOCOL:-ws}
      BROKER_URL: amqp://${RABBITMQ_USERNAME:-guest}:${RABBITMQ_PASSWORD:-guest}@message_broker:5672/${RABBITMQ_VHOST:-/}
      REDIS_HOST: cache
      SECRET_KEY: ${SECRET_KEY}
      DATABASE_NAME: ${DATABASE_NAME:-ramascene.db}
      DATASETS_VERSION: ${DATASETS_VERSION}
    ports:
      - "8000:8000"
    restart: unless-stopped
    volumes:
      - .:/mnt/data
      - ../datasets:/mnt/datasets:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/health/')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
  analyser:
    build:
      context: ./
      target: python
      args:
        DJANGO_SETTINGS_MODULE: ${DJANGO_SETTINGS_MODULE:-ramasceneMasterProject.config.production}
        PUBLIC_DIR: static_assets
        HOST: ${HOST:-www.ramascene.eu}
        WS_HOST: ${WS_HOST:-www.ramascene.eu}
        PROTOCOL: ${PROTOCOL:-http}
        WS_PROTOCOL: ${WS_PROTOCOL:-ws}
        BROKER_URL: amqp://${RABBITMQ_USERNAME:-guest}:${RABBITMQ_PASSWORD:-guest}@message_broker:5672/${RABBITMQ_VHOST:-/}
        REDIS_HOST: cache
        SECRET_KEY: ${SECRET_KEY}
        DATABASE_NAME: ${DATABASE_NAME:-ramascene.db}
        DATASETS_VERSION: ${DATASETS_VERSION}
        OPENBLAS_NUM_THREADS: 1
    command: ["celery", "-A", "ramasceneMasterProject", "worker", "-l", "info", "--concurrency", "1", "--max-tasks-per-child", "1", "--queue", "calc_default", "-n", "worker1.%h"]
    container_name: rama-scene-analyser
    depends_on:
      - cache
      - message_broker
    environment:
      DEBUG: ${DEBUG:-false}
      DJANGO_SETTINGS_MODULE: ${DJANGO_SETTINGS_MODULE:-ramasceneMasterProject.config.production}
      PUBLIC_DIR: static_assets
      HOST: ${HOST:-www.ramascene.eu}
      WS_HOST: ${WS_HOST:-www.ramascene.eu}
      PROTOCOL: ${PROTOCOL:-http}
      WS_PROTOCOL: ${WS_PROTOCOL:-ws}
      BROKER_URL: amqp://${RABBITMQ_USERNAME:-guest}:${RABBITMQ_PASSWORD:-guest}@message_broker:5672/${RABBITMQ_VHOST:-/}
      REDIS_HOST: cache
      SECRET_KEY: ${SECRET_KEY}
      DATABASE_NAME: ${DATABASE_NAME:-ramascene.db}
      DATASETS_VERSION: ${DATASETS_VERSION}
      OPENBLAS_NUM_THREADS: 2
    restart: unless-stopped
    volumes:
      - .:/mnt/data
      - ../datasets:/mnt/datasets:ro
    healthcheck:
      test: ["CMD", "celery", "-A", "ramasceneMasterProject", "inspect", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
  modeller:
    build:
      context: ./
      target: python
      args:
        DJANGO_SETTINGS_MODULE: ${DJANGO_SETTINGS_MODULE:-ramasceneMasterProject.config.production}
        PUBLIC_DIR: static_assets
        HOST: ${HOST:-www.ramascene.eu}
        WS_HOST: ${WS_HOST:-www.ramascene.eu}
        PROTOCOL: ${PROTOCOL:-http}
        WS_PROTOCOL: ${WS_PROTOCOL:-ws}
        BROKER_URL: amqp://${RABBITMQ_USERNAME:-guest}:${RABBITMQ_PASSWORD:-guest}@message_broker:5672/${RABBITMQ_VHOST:-/}
        REDIS_HOST: cache
        SECRET_KEY: ${SECRET_KEY}
        DATABASE_NAME: ${DATABASE_NAME:-ramascene.db}
        DATASETS_VERSION: ${DATASETS_VERSION}
        OPENBLAS_NUM_THREADS: 1
    command: ["celery", "-A", "ramasceneMasterProject", "worker", "-l", "info", "--concurrency", "1", "--max-tasks-per-child", "1", "--queue", "modelling", "-n", "worker2.%h"]
    container_name: rama-scene-modeller
    depends_on:
      - cache
      - message_broker
    environment:
      DEBUG: ${DEBUG:-false}
      DJANGO_SETTINGS_MODULE: ${DJANGO_SETTINGS_MODULE:-ramasceneMasterProject.config.production}
      PUBLIC_DIR: static_assets
      HOST: ${HOST:-www.ramascene.eu}
      WS_HOST: ${WS_HOST:-www.ramascene.eu}
      PROTOCOL: ${PROTOCOL:-http}
      WS_PROTOCOL: ${WS_PROTOCOL:-ws}
      BROKER_URL: amqp://${RABBITMQ_USERNAME:-guest}:${RABBITMQ_PASSWORD:-guest}@message_broker:5672/${RABBITMQ_VHOST:-/}
      REDIS_HOST: cache
      SECRET_KEY: ${SECRET_KEY}
      DATABASE_NAME: ${DATABASE_NAME:-ramascene.db}
      DATASETS_VERSION: ${DATASETS_VERSION}
      OPENBLAS_NUM_THREADS: 1
    restart: unless-stopped
    volumes:
      - .:/mnt/data
      - ../datasets:/mnt/datasets:ro
    healthcheck:
      test: ["CMD", "celery", "-A", "ramasceneMasterProject", "inspect", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
  message_broker:
    image: rabbitmq:3.12-management-alpine
    container_name: rama-scene-rabbitmq
    environment:
      HOSTNAME: 'rabbitmq'
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-guest}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-/}
    hostname: 'rabbitmq'
    ports:
      - "5672:5672"
      - "15672:15672"
    restart: unless-stopped
    volumes:
      - ramascene_rabbitmq:/var/lib/rabbitmq/mnesia/
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
  cache:
    image: redis:7.2-alpine
    container_name: rama-scene-redis
    ports:
      - "6379:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    volumes:
      - ramascene_redis:/data
volumes:
  ramascene_rabbitmq:
  ramascene_redis: